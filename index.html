<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap d20</title>
<meta name="description" content="Tap the die to roll a d20.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#e4e8e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="d20">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/cinzel-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Cinzel"; font-weight: 800; font-display: swap; src: url("fonts/cinzel-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400; font-display: swap; src: url("fonts/figtree-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 600; font-display: swap; src: url("fonts/figtree-latin-600-normal.woff2") format("woff2"); }

/* One-screen table: the die sits centered on a felt ground, result below, roll history as a list under it, newest on top. */
:root {
  --bg: #e4e8e2;
  --felt: #d3dbd2;
  --fg: #1e2622;
  --muted: #5f6b64;
  --accent: #3a2f6b;
  --crit: #a0761a;
  --fumble: #a33a2e;
  --chip: #c7d0c6;
  --on-accent: #ffffff;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --felt: #1a221d; --fg: #e9ede7; --muted: #94a199;
    --accent: #b9adf2; --crit: #e2b44f; --fumble: #ef7a6b; --chip: #26302a; --on-accent: #1a1530;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --felt: #1a221d; --fg: #e9ede7; --muted: #94a199;
  --accent: #b9adf2; --crit: #e2b44f; --fumble: #ef7a6b; --chip: #26302a; --on-accent: #1a1530;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { font-size: 14px; }
body {
  background: radial-gradient(ellipse at 50% 40%, var(--felt), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
#stage {
  flex: none;
  width: min(380px, 100%);
  aspect-ratio: 1;
  max-width: 100%;
  cursor: pointer;
  border: 0;
  padding: 0;
  background: none;
  border-radius: 50%;
  position: relative;
  touch-action: manipulation;
}
#stage:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
#stage canvas { width: 100% !important; height: 100% !important; display: block; transition: filter .4s; }
#stage.crit canvas { filter: drop-shadow(0 0 18px var(--crit)); }
#stage.fumble canvas { filter: saturate(.35) brightness(.8) drop-shadow(0 0 16px var(--fumble)); }
#result {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(64px, 18vw, 104px);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  min-height: 1em;
  transition: color .2s, transform .25s;
}
#result.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.7); opacity: .2 } 70% { transform: scale(1.08) } 100% { transform: scale(1); opacity: 1 } }
#result.crit { color: var(--crit); }
#result.fumble { color: var(--fumble); }
#label {
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  min-height: 1.4em;
  font-weight: 600;
}
#label.crit { color: var(--crit); }
#label.fumble { color: var(--fumble); }
#history {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex: 0 1 auto;
  min-height: 0;
  overflow-y: auto;
  width: min(380px, 100%);
  margin-top: 8px;
  padding-bottom: 8px;
  -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent);
  mask-image: linear-gradient(to bottom, #000 80%, transparent);
}
#history span {
  flex: none;
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  min-width: 2.2em;
  text-align: center;
  padding: 2px 6px;
  border-radius: 6px;
  color: var(--muted);
  transition: font-size .25s ease-out;
}
/* Newest three read larger, stepping down to the plain list. */
#history span:nth-child(1) { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--fg); }
#history span:nth-child(2) { font-family: var(--display); font-weight: 800; font-size: 23px; color: var(--fg); }
#history span:nth-child(3) { font-family: var(--display); font-weight: 800; font-size: 18px; }
#history span.crit { color: var(--crit); }
#history span.fumble { color: var(--fumble); }
#history span.enter { animation: drop .3s ease-out; }
@keyframes drop { from { transform: translateY(-100%); opacity: 0 } to { transform: none; opacity: 1 } }
#history span.hint { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); }
#controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 4px;
}
.seg, .mod {
  display: flex;
  align-items: center;
  background: var(--chip);
  border-radius: 10px;
  padding: 3px;
}
#controls button {
  border: 0;
  background: none;
  color: var(--muted);
  font: 600 13px var(--body);
  min-height: 36px;
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
#controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg button { padding: 0 12px; letter-spacing: .03em; }
#controls .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.mod button { width: 40px; font-size: 22px; color: var(--fg); }
.mod output { min-width: 3ch; text-align: center; font: 600 15px var(--body); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { #result.pop, #history span.enter { animation: none; } }
</style>
</head>
<body>

<button id="stage" type="button" aria-label="Roll the d20"></button>
<div id="result" aria-live="polite">20</div>
<div id="label">Tap the die to roll</div>
<div id="controls">
  <div class="seg" role="group" aria-label="Roll mode">
    <button type="button" data-mode="dis">Disadv</button>
    <button type="button" data-mode="normal">Normal</button>
    <button type="button" data-mode="adv">Adv</button>
  </div>
  <div class="mod" role="group" aria-label="Modifier">
    <button type="button" data-step="-1" aria-label="Lower modifier">&minus;</button>
    <output id="mod" aria-live="polite">+0</output>
    <button type="button" data-step="1" aria-label="Raise modifier">+</button>
  </div>
  <div class="seg" role="group" aria-label="Die style">
    <button type="button" data-style="amethyst">Amethyst</button>
    <button type="button" data-style="obsidian">Obsidian</button>
    <button type="button" data-style="quartz">Quartz</button>
    <button type="button" data-style="steel">Steel</button>
  </div>
</div>
<div id="history"><span class="hint">Last rolls show here</span></div>

<script src="vendor/three.min.js"></script>
<script>
(async function () {
  const stage = document.getElementById('stage');
  const resultEl = document.getElementById('result');
  const labelEl = document.getElementById('label');
  const historyEl = document.getElementById('history');
  const modEl = document.getElementById('mod');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  try { await Promise.all([document.fonts.load('800 100px Cinzel'), document.fonts.load('600 100px Figtree')]); } catch (e) {}

  // Die looks, from the dice design canvas. mat goes straight into MeshPhysicalMaterial.
  const CINZEL = '800 {px}px Cinzel, Georgia, serif';
  const FIGTREE = '600 {px}px Figtree, system-ui, sans-serif';
  const STYLES = {
    amethyst: { top: '#5a4ca6', bot: '#2c2458', ink: '#f3eee0', crit: '#f2cf74', edge: 'rgba(200,190,255,0.22)', shadow: 'rgba(0,0,0,0.45)', font: CINZEL, rim: 0xc9c0ff,
      mat: { roughness: 0.32, metalness: 0.08, envMapIntensity: 0.5 } },
    obsidian: { top: '#2e2e35', bot: '#0b0b0e', ink: '#e2b44f', crit: '#f2cf74', edge: 'rgba(226,180,79,0.6)', shadow: 'rgba(0,0,0,0.6)', font: CINZEL, rim: 0xe2b44f,
      mat: { roughness: 0.1, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.2 } },
    quartz: { top: '#e6f4f6', bot: '#86b9c6', ink: '#1d4a56', crit: '#a0761a', edge: 'rgba(255,255,255,0.85)', shadow: 'rgba(255,255,255,0.5)', font: FIGTREE, rim: 0xffffff,
      mat: { roughness: 0.05, metalness: 0, clearcoat: 1, envMapIntensity: 1.4, transparent: true, opacity: 0.62, depthWrite: false } },
    steel: { top: '#d9dde0', bot: '#7b838a', ink: '#2a2f33', crit: '#8a5d00', edge: 'rgba(255,255,255,0.7)', shadow: 'rgba(255,255,255,0.45)', font: FIGTREE, rim: 0xffffff, brushed: true,
      mat: { roughness: 0.35, metalness: 0.85, envMapIntensity: 1.1 } }
  };

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 3));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  // Soft studio reflections so glass and metal have something to reflect.
  const envCv = document.createElement('canvas');
  envCv.width = 512; envCv.height = 256;
  const ectx = envCv.getContext('2d');
  const eg = ectx.createLinearGradient(0, 0, 0, 256);
  eg.addColorStop(0, '#ffffff');
  eg.addColorStop(0.45, '#8a8f99');
  eg.addColorStop(1, '#1c1f22');
  ectx.fillStyle = eg;
  ectx.fillRect(0, 0, 512, 256);
  ectx.fillStyle = 'rgba(255,255,255,0.9)';
  ectx.fillRect(60, 40, 90, 50);
  ectx.fillRect(300, 60, 140, 30);
  const envTex = new THREE.CanvasTexture(envCv);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.encoding = THREE.sRGBEncoding;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  envTex.dispose();
  pmrem.dispose();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
  camera.position.set(0, 0, 6.2);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x404050, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(-2.5, 3.5, 5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xc9c0ff, 0.35);
  rim.position.set(3, -2, 2);
  scene.add(rim);

  // Shadow under the die
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = shadowCanvas.height = 128;
  const sctx = shadowCanvas.getContext('2d');
  const grad = sctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(0,0,0,0.38)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, 128, 128);
  const shadowTex = new THREE.CanvasTexture(shadowCanvas);
  function makeShadow() {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(2.4, 0.7),
      new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
    );
    scene.add(m);
    return m;
  }

  // Build the icosahedron with one material per face
  const base = new THREE.IcosahedronGeometry(1.15, 0);
  const pos = base.getAttribute('position');
  const faceCount = pos.count / 3;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', pos.clone());
  const H = Math.sqrt(3) / 2;
  const vTop = 1, vBot = 1 - H;
  const uvs = [];
  for (let i = 0; i < faceCount; i++) {
    uvs.push(0.5, vTop, 0, vBot, 1, vBot);
    geo.addGroup(i * 3, 3, i);
  }
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.computeVertexNormals();

  // Face frames: normal and "up" (centroid toward first vertex, which is the top of the numeral)
  const faces = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < faceCount; i++) {
    a.fromBufferAttribute(pos, i * 3);
    b.fromBufferAttribute(pos, i * 3 + 1);
    c.fromBufferAttribute(pos, i * 3 + 2);
    const centroid = new THREE.Vector3().add(a).add(b).add(c).divideScalar(3);
    const normal = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    if (normal.dot(centroid) < 0) normal.negate();
    const up = new THREE.Vector3().subVectors(a, centroid).normalize();
    faces.push({ normal, up, value: 0 });
  }

  // Number faces so opposite sides add up to 21, like a real d20
  let next = 1;
  for (let i = 0; i < faceCount; i++) {
    if (faces[i].value) continue;
    let opp = -1, best = 1;
    for (let j = 0; j < faceCount; j++) {
      const d = faces[i].normal.dot(faces[j].normal);
      if (j !== i && !faces[j].value && d < best) { best = d; opp = j; }
    }
    faces[i].value = next;
    faces[opp].value = 21 - next;
    next++;
  }

  function faceTexture(n, st) {
    const S = 512, k = S / 256;
    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, S * H);
    g.addColorStop(0, st.top);
    g.addColorStop(1, st.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, S, S);
    if (st.brushed) {
      for (let i = 0; i < 700; i++) {
        ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
        ctx.fillRect(0, Math.random() * S, S, k * 0.5);
      }
    }
    // inner triangle line for a cut-edge look
    const cy = (1 - (vTop + vBot * 2) / 3) * S;
    ctx.save();
    ctx.translate(S / 2, cy);
    ctx.scale(0.86, 0.86);
    ctx.translate(-S / 2, -cy);
    ctx.beginPath();
    ctx.moveTo(S / 2, 0);
    ctx.lineTo(0, S * H);
    ctx.lineTo(S, S * H);
    ctx.closePath();
    ctx.strokeStyle = st.edge;
    ctx.lineWidth = 3 * k;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = n === 20 ? st.crit : st.ink;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = st.font.replace('{px}', (n >= 10 ? 76 : 86) * k);
    ctx.shadowColor = st.shadow;
    ctx.shadowBlur = 4 * k;
    ctx.shadowOffsetY = 2 * k;
    ctx.fillText(String(n), S / 2, cy + 6 * k);
    if (n === 6 || n === 9) {
      ctx.fillRect(S / 2 - 18 * k, cy + 44 * k, 36 * k, 6 * k);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // Two dice: the second only shows for advantage and disadvantage.
  // Each has a back-face child, drawn first, so the clear style shows its far side.
  const dice = [0, 1].map(() => {
    const mesh = new THREE.Mesh(geo, []);
    const back = new THREE.Mesh(geo, []);
    back.renderOrder = -1;
    mesh.add(back);
    scene.add(mesh);
    return { mesh, back, shadow: makeShadow(), x: 0, s: 1 };
  });

  let style = 'amethyst';
  let textures = [];
  function applyStyle() {
    const st = STYLES[style];
    textures.forEach(t => t.dispose());
    textures = faces.map(f => faceTexture(f.value, st));
    rim.color.setHex(st.rim);
    const make = (side, o) => textures.map(map => {
      const m = new THREE.MeshPhysicalMaterial({ map, flatShading: true, ...st.mat, side, opacity: o });
      m.userData.o = o;
      return m;
    });
    dice.forEach(d => {
      [d.mesh, d.back].forEach(m => m.material.forEach(x => x.dispose()));
      const o = st.mat.opacity || 1;
      d.mesh.material = make(THREE.FrontSide, o);
      d.back.material = make(THREE.BackSide, o * 0.6);
      d.back.visible = !!st.mat.transparent;
    });
    document.querySelectorAll('[data-style]').forEach(b => b.setAttribute('aria-pressed', b.dataset.style === style));
  }

  function setDim(d, on) {
    [d.mesh, d.back].forEach(mesh => mesh.material.forEach(m => {
      m.transparent = on || !!STYLES[style].mat.transparent;
      m.opacity = m.userData.o * (on ? 0.35 : 1);
    }));
  }

  // Orientation that shows a given face to the camera, numeral upright, with a slight tilt
  const tilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.2, 0.16, 0));
  function showFace(i) {
    const f = faces[i];
    const right = new THREE.Vector3().crossVectors(f.up, f.normal).normalize();
    const m = new THREE.Matrix4().makeBasis(right, f.up, f.normal);
    const q = new THREE.Quaternion().setFromRotationMatrix(m).invert();
    return tilt.clone().multiply(q);
  }

  function randInt(n) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }

  function resize() {
    const w = stage.clientWidth;
    renderer.setSize(w, w, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // Roll settings, remembered between visits
  let mode = 'normal';
  let mod = 0;
  try {
    const m = localStorage.getItem('d20.mode');
    if (m === 'adv' || m === 'dis') mode = m;
    mod = Math.max(-20, Math.min(20, parseInt(localStorage.getItem('d20.mod'), 10) || 0));
    const s = localStorage.getItem('d20.style');
    if (STYLES[s]) style = s;
  } catch (e) {}
  function save() {
    try { localStorage.setItem('d20.mode', mode); localStorage.setItem('d20.mod', mod); localStorage.setItem('d20.style', style); } catch (e) {}
  }
  applyStyle();
  const signed = n => (n < 0 ? '\u2212' : '+') + Math.abs(n);

  function layout() {
    const two = mode !== 'normal';
    dice.forEach((d, i) => {
      d.x = two ? (i ? 0.86 : -0.86) : 0;
      d.s = two ? 0.72 : 1;
      d.mesh.visible = d.shadow.visible = i === 0 || two;
      d.mesh.position.x = d.x;
      d.mesh.scale.setScalar(d.s);
      d.shadow.position.set(d.x, -1.45 * d.s, -0.5);
      d.shadow.scale.set(d.s, d.s, 1);
      d.shadow.material.opacity = 1;
      setDim(d, false);
    });
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
    modEl.textContent = signed(mod);
    stage.setAttribute('aria-label', mode === 'adv' ? 'Roll with advantage' : mode === 'dis' ? 'Roll with disadvantage' : 'Roll the d20');
  }

  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (anim || b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    save();
    layout();
  }));
  document.querySelectorAll('[data-style]').forEach(b => b.addEventListener('click', () => {
    if (anim || b.dataset.style === style) return;
    style = b.dataset.style;
    save();
    applyStyle();
    layout();
  }));
  document.querySelectorAll('.mod button').forEach(b => b.addEventListener('click', () => {
    mod = Math.max(-20, Math.min(20, mod + Number(b.dataset.step)));
    save();
    modEl.textContent = signed(mod);
  }));

  // Start showing 20
  const startFace = faces.findIndex(f => f.value === 20);
  dice.forEach(d => d.mesh.quaternion.copy(showFace(startFace)));

  let anim = null;
  layout();

  function roll() {
    if (anim) return;
    const count = mode === 'normal' ? 1 : 2;
    const rolls = [];
    for (let i = 0; i < count; i++) {
      const value = randInt(20) + 1;
      setDim(dice[i], false);
      rolls.push({
        value,
        from: dice[i].mesh.quaternion.clone(),
        to: showFace(faces.findIndex(f => f.value === value)),
        axis: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(),
        turns: reduceMotion ? 0 : 3 + randInt(2),
        phase: i * 0.12
      });
    }
    anim = { t0: performance.now(), dur: reduceMotion ? 250 : 1500, rolls };
    resultEl.textContent = '';
    resultEl.className = '';
    stage.className = '';
    labelEl.textContent = 'Rolling…';
    labelEl.className = '';
  }

  function finish(values) {
    let natural = values[0];
    let detail = '';
    if (values.length === 2) {
      natural = mode === 'adv' ? Math.max(...values) : Math.min(...values);
      const kept = values[0] === natural ? 0 : 1;
      setDim(dice[1 - kept], true);
      detail = natural + ' (' + values[1 - kept] + ' dropped)';
    }
    if (mod) detail = (detail || natural) + ' ' + signed(mod).replace(/^(.)/, '$1 ');
    const total = natural + mod;

    resultEl.textContent = total;
    const cls = natural === 20 ? 'crit' : natural === 1 ? 'fumble' : '';
    resultEl.className = cls;
    void resultEl.offsetWidth;
    resultEl.classList.add('pop');
    labelEl.className = cls;
    stage.className = cls;
    const nat = natural === 20 ? 'Natural 20' : natural === 1 ? 'Natural 1' : '';
    labelEl.textContent = [nat, detail].filter(Boolean).join(' · ') || 'Tap to roll again';

    // Newest roll goes on top and pushes the older ones down.
    const hint = historyEl.querySelector('.hint');
    if (hint) hint.remove();
    const s = document.createElement('span');
    s.textContent = total;
    if (detail) s.title = detail;
    if (natural === 20) s.className = 'crit';
    if (natural === 1) s.className = 'fumble';
    s.classList.add('enter');
    historyEl.prepend(s);
    historyEl.scrollTop = 0;
    while (historyEl.children.length > 50) historyEl.lastChild.remove();
    try { navigator.vibrate && navigator.vibrate(natural === 20 ? [30, 40, 30] : 20); } catch (e) {}
  }

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const spin = new THREE.Quaternion();
  const tmp = new THREE.Quaternion();
  let idleT = 0;

  function frame(now) {
    if (anim) {
      const t = Math.min(1, (now - anim.t0) / anim.dur);
      const e = easeOut(t);
      anim.rolls.forEach((r, i) => {
        const d = dice[i];
        tmp.copy(r.from).slerp(r.to, e);
        spin.setFromAxisAngle(r.axis, r.turns * Math.PI * 2 * (1 - e));
        d.mesh.quaternion.copy(spin).multiply(tmp);

        // bounces: decaying hops, the second die slightly out of step
        const tp = Math.min(1, t + r.phase * (1 - t));
        const hop = reduceMotion ? 0 : Math.abs(Math.sin(tp * Math.PI * 3)) * Math.pow(1 - t, 1.6) * 0.9 * d.s;
        d.mesh.position.y = hop;
        const s = d.s * (1 - hop * 0.35);
        d.shadow.scale.set(s, s, 1);
        d.shadow.material.opacity = 1 - hop * 0.6;
      });

      if (t >= 1) {
        dice.forEach(d => { d.mesh.position.y = 0; });
        const values = anim.rolls.map(r => r.value);
        anim = null;
        finish(values);
      }
    } else if (!reduceMotion) {
      idleT += 0.016;
      dice.forEach((d, i) => { d.mesh.position.y = Math.sin(idleT * 1.6 + i * 1.3) * 0.03 * d.s; });
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  stage.addEventListener('click', roll);
  document.addEventListener('keydown', e => {
    // Buttons handle their own Space and Enter.
    if ((e.code === 'Space' || e.code === 'Enter') && !(document.activeElement instanceof HTMLButtonElement)) {
      e.preventDefault();
      roll();
    }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  // Reload once when a new version takes over, so updates show without closing the app.
  if (navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloaded) { reloaded = true; location.reload(); }
    });
  }
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {}));
}
</script>
